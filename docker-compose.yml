# Local MySQL for jwt-pizza-service (CS329).
#
# Fixed host port 3306, unlike other stacks on this machine that derive a
# port per checkout: src/config.js sets no `port`, so mysql2 connects to
# MySQL's default. One project, one instance, nothing to collide with.
#
# The root password is read from .env, which is generated from
# src/config.js so the two cannot drift. Both are gitignored.
#
#   docker compose up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?unset — regenerate .env from src/config.js}
      MYSQL_DATABASE: pizza
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
